name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Runner image is pinned rather than `ubuntu-latest`.
#
# `ubuntu-latest` migrates to Ubuntu 26 on 2026-10-19. The API job installs
# libgdal-dev/libgeos-dev from apt — Django's PostGIS backend cannot load
# without them — so an unattended OS change under the pipeline is not a risk
# worth taking on the same week the pipeline started passing. Unpin once a
# green run has landed on Ubuntu 26; the pin is a delay, not a policy.

jobs:
  api:
    name: API
    runs-on: ubuntu-24.04

    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: barbershop
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      POSTGRES_DB: barbershop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      TEST_POSTGRES_DB: test_barbershop
      SECRET_KEY: ci-secret-key-not-used-against-real-data
      FIELD_ENCRYPTION_KEY: ci-encryption-key
      USE_PYTHON_VERSION: "3.13"

    defaults:
      run:
        working-directory: services/api

    steps:
      - uses: actions/checkout@v7

      # v7 is the newest *floating* major this action publishes, and v7 is the
      # node24 switch — which is all the deprecation asks for. Releases exist up
      # to v10.3.0, but there is no `v8`/`v9`/`v10` moving tag, and those majors
      # change cache pruning and cache-poisoning defaults we would be pulling in
      # for no benefit.
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --group ci

      - name: Check the lockfile is current
        # A stale lockfile means CI is not testing what will ship.
        run: uv lock --check

      # Django's PostGIS backend loads GDAL and GEOS through ctypes, and the
      # GitHub runner image has neither. The runtime packages ship only
      # versioned sonames (`libgdal.so.32`); the unversioned `libgdal.so` and
      # `libgeos_c.so` that Django's `find_library` name list actually looks for
      # come from the -dev packages. Without this, `manage.py check` dies in
      # Django's own import chain before it says anything useful.
      - name: Install GIS libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgdal-dev libgeos-dev libproj-dev

          # Resolve explicitly rather than trusting that the symlinks landed, and
          # fail here with a clear message if they did not. Setting an empty
          # path would just move the failure somewhere less legible. The `ls`
          # fallback covers the case where the ldconfig cache has not been
          # refreshed after the install.
          gdal_so=$(ldconfig -p | awk '/libgdal\.so/ {print $NF; exit}')
          geos_so=$(ldconfig -p | awk '/libgeos_c\.so/ {print $NF; exit}')
          [ -n "$gdal_so" ] || gdal_so=$(ls /usr/lib/*/libgdal.so* /lib/*/libgdal.so* 2>/dev/null | head -1)
          [ -n "$geos_so" ] || geos_so=$(ls /usr/lib/*/libgeos_c.so* /lib/*/libgeos_c.so* 2>/dev/null | head -1)
          if [ -z "$gdal_so" ] || [ -z "$geos_so" ]; then
            echo "::error::GDAL/GEOS did not resolve after install (gdal='$gdal_so' geos='$geos_so')"
            exit 1
          fi
          echo "GDAL_LIBRARY_PATH=$gdal_so" >> "$GITHUB_ENV"
          echo "GEOS_LIBRARY_PATH=$geos_so" >> "$GITHUB_ENV"

      - name: The GIS libraries load
        run: |
          uv run python -c "
          from django.contrib.gis.gdal import libgdal
          from django.contrib.gis.geos import libgeos
          print('GDAL', libgdal.gdal_version())
          print('GEOS', libgeos.geos_version())
          "

      - name: Django system check
        run: uv run python manage.py check --deploy --fail-level ERROR
          || uv run python manage.py check

      - name: Migrations are in sync with the models
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      # Configured but not previously run: it drifted to 12 errors unnoticed.
      - name: Mypy
        run: uv run mypy .

      - name: Pytest
        run: uv run pytest --cov-report=xml --cov-report=term-missing

      - name: Coverage is uploaded
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-coverage
          path: services/api/htmlcov
          retention-days: 7

  app:
    name: Mobile app
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test -- --ci

      # A screen that typechecks can still fail to bundle on a missing asset or
      # a bad import, and that only shows up on a device otherwise.
      - name: Bundle
        run: npx expo export --platform all --output-dir dist

  web:
    name: Marketing site
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # A single-page app with real routes only fails in ways that matter when
      # it is actually served. The deep link has to come back, the assets have
      # to exist, and an unknown route has to fall back to index.html rather
      # than 404 — that fallback is written per host, so nothing but this
      # catches it being forgotten.
      - name: The built site serves
        run: |
          # `--logLevel error`, not `--silent`: Vite has no `--silent` flag and
          # exits on the unknown option, so the server never started and the
          # checks below failed against nothing.
          npx vite preview --port 4173 --logLevel error &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT

          ready=""
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:4173/; then ready=1; break; fi
            if ! kill -0 $server_pid 2>/dev/null; then
              echo "::error::vite preview exited before serving anything"
              exit 1
            fi
            sleep 1
          done
          # Otherwise the loop below reports five confusing "served 000" errors
          # for what is really one problem: the server never booted.
          if [ -z "$ready" ]; then
            echo "::error::vite preview did not come up on port 4173"
            exit 1
          fi

          for path in / /knowledge /assets/logo-512.png /assets/favicon.png /a-route-that-does-not-exist; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:4173$path")
            if [ "$code" != "200" ]; then
              echo "::error::$path served $code, expected 200"
              exit 1
            fi
          done
