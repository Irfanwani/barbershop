    PaymentStatusEnum:
      enum:
      - created
      - attempted
      - captured
      - failed
      - refunded
      type: string
      description: |-
        * `created` - Order created
        * `attempted` - Payment attempted
        * `captured` - Captured
        * `failed` - Failed
        * `refunded` - Refunded
    PaymentWebhookRequest:
      type: object
      description: |-
        Razorpay's webhook envelope.

        Documented here for the schema, but **not used to validate the request**.
        The signature covers the raw bytes, so it is verified first and in full —
        before this shape is parsed, and before any of it is trusted. Parsing an
        unverified payload and then checking a signature over the re-serialised
        version would be a different check, and a weaker one.
      properties:
        event:
          type: string
          minLength: 1
          description: '`payment.captured` or `payment.failed`; anything else is acknowledged
            and ignored.'
        payload:
          type: object
          additionalProperties: {}
      required:
      - event
      - payload
    PayoutRequest:
      type: object
      description: |-
        Provider payout account.

        Account number and IFSC code are write-only and read back masked. The old
        ``BankDetailsSerializer`` used ``fields='__all__'`` and handed the full
        account number to any authenticated caller who asked.
      properties:
        business_name:
          type: string
          minLength: 1
          maxLength: 120
        business_type:
          $ref: '#/components/schemas/BusinessTypeEnum'
        beneficiary_name:
          type: string
          minLength: 1
          maxLength: 120
        account_type:
          $ref: '#/components/schemas/AccountTypeEnum'
        account_number:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 34
        ifsc_code:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 11
