      enum:
      - pending
      - paid
      - ready
      - collected
      - cancelled
      - refunded
      type: string
      description: |-
        * `pending` - Pending
        * `paid` - Paid
        * `ready` - Ready for collection
        * `collected` - Collected
        * `cancelled` - Cancelled
        * `refunded` - Refunded
