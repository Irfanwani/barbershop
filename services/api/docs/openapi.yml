components:
  schemas:
    AccountState:
      type: object
      description: |-
        The current user plus every flag the app branches on during onboarding.

        The old ``authenticateuser`` endpoint returned ``is_barber`` computed by
        trying ``BarberDetails.objects.get(...)`` and falling through to
        ``is_barber=True``, so a brand-new customer was reported as a barber.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        display_name:
          type: string
          readOnly: true
        role:
          type: string
          readOnly: true
        is_verified:
          type: boolean
          readOnly: true
          description: True once the address on this account has been confirmed.
        verified_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        has_customer_profile:
          type: boolean
          readOnly: true
        has_provider_profile:
          type: boolean
          readOnly: true
        has_payout:
          type: boolean
          readOnly: true
        service_count:
          type: integer
          readOnly: true
        onboarding_complete:
          type: boolean
          readOnly: true
      required:
      - display_name
      - email
      - first_name
      - has_customer_profile
      - has_payout
      - has_provider_profile
      - id
      - is_verified
      - last_name
      - onboarding_complete
      - role
      - service_count
      - username
      - verified_at
    AccountTypeEnum:
      enum:
      - savings
      - current
      type: string
      description: |-
        * `savings` - Savings
        * `current` - Current
    ActionEnum:
      enum:
      - cancel
      - ready
      - collect
      type: string
      description: |-
        * `cancel` - cancel
        * `ready` - ready
        * `collect` - collect
    AvailabilityToggleRequest:
      type: object
      description: |-
        Accepting bookings, or not.

        Separate from the shop serializer because turning this off is the single
        most consequential thing a provider can do from the app, and it deserves an
        explicit, self-describing call.
      properties:
        is_accepting_bookings:
          type: boolean
      required:
      - is_accepting_bookings
    BlankEnum:
      enum:
      - ''
    Booking:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        reference:
          type: string
          readOnly: true
        provider:
          allOf:
          - $ref: '#/components/schemas/ProviderSummary'
          readOnly: true
        customer:
          type: object
          additionalProperties: {}
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/BookingStatusEnum'
          readOnly: true
        starts_at:
          type: string
          format: date-time
          readOnly: true
        ends_at:
          type: string
          format: date-time
          readOnly: true
        duration_minutes:
          type: integer
          readOnly: true
        subtotal:
          type: integer
          readOnly: true
        subtotal_display:
          type: string
          readOnly: true
        platform_fee:
          type: integer
          readOnly: true
        platform_fee_display:
          type: string
          readOnly: true
        total:
          type: integer
          readOnly: true
        total_display:
          type: string
          readOnly: true
        currency:
          type: string
          readOnly: true
        notes:
          type: string
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/BookingItem'
          readOnly: true
        can_be_cancelled:
          type: boolean
          readOnly: true
        is_paid:
          type: boolean
          readOnly: true
        cancelled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        cancellation_reason:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - can_be_cancelled
      - cancellation_reason
      - cancelled_at
      - created_at
      - currency
      - customer
      - duration_minutes
      - ends_at
      - id
      - is_paid
      - items
      - notes
      - platform_fee
      - platform_fee_display
      - provider
      - reference
      - starts_at
      - status
      - subtotal
      - subtotal_display
      - total
      - total_display
    BookingCreateRequest:
      type: object
      description: |-
        Create a booking.

        Accepts ``provider``, ``services`` (ids) and ``starts_at``. The total is
        computed here from :class:`~providers.models.Service` rows, never read from
        the request.

        The old endpoint stored ``request.data['totalcost']`` verbatim, so a client
        could book a 900-rupee haircut for one rupee.
      properties:
        provider:
          type: integer
        services:
          type: array
          items:
            type: integer
        starts_at:
          type: string
          format: date-time
        notes:
          type: string
          default: ''
          maxLength: 500
      required:
      - provider
      - services
      - starts_at
    BookingItem:
      type: object
      description: |-
        One line of a booking.

        Reads the snapshot, not the live service row: if the provider raises this
        price next month, yesterday's invoice must not change.
      properties:
        id:
          type: integer
          readOnly: true
        service:
          type: integer
          readOnly: true
          nullable: true
        name:
          type: string
          readOnly: true
        unit_price:
          type: integer
          readOnly: true
          description: In the smallest currency unit.
        unit_price_display:
          type: string
          readOnly: true
        quantity:
          type: integer
          readOnly: true
        duration_minutes:
          type: integer
          readOnly: true
        line_total:
          type: integer
          readOnly: true
      required:
      - duration_minutes
      - id
      - line_total
      - name
      - quantity
      - service
      - unit_price
      - unit_price_display
