          readOnly: true
        subtotal:
          type: integer
          readOnly: true
        subtotal_display:
          type: string
          readOnly: true
        platform_fee:
          type: integer
          readOnly: true
        platform_fee_display:
          type: string
          readOnly: true
        total:
          type: integer
          readOnly: true
        total_display:
          type: string
          readOnly: true
        currency:
          type: string
          readOnly: true
        deposit:
          type: integer
          readOnly: true
        deposit_display:
          type: string
          readOnly: true
        balance:
          type: integer
          readOnly: true
        balance_display:
          type: string
          readOnly: true
        amount_paid:
          type: integer
          readOnly: true
        amount_due:
          type: integer
          readOnly: true
        requires_deposit:
          type: boolean
          readOnly: true
        cancellation_window_hours:
          type: integer
          readOnly: true
        cancellation_deadline:
