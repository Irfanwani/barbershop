          minimum: 0
        platform_fee:
          type: integer
          maximum: 2147483647
          minimum: 0
        total:
          type: integer
          maximum: 2147483647
          minimum: 0
        total_display:
          type: string
          readOnly: true
        currency:
          type: string
          maxLength: 3
        notes:
          type: string
          maxLength: 500
        paid_at:
          type: string
          format: date-time
          nullable: true
        collected_at:
          type: string
          format: date-time
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        can_be_paid:
          type: boolean
          readOnly: true
        can_be_collected:
          type: boolean
          readOnly: true
        created_at:
          type: string
