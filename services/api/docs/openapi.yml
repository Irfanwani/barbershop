  /api/v1/providers/:
    get:
      operationId: providers_list
      description: All filters are optional and combine. Supplying `lat`/`lng` sorts
        results nearest-first and adds `distance_km` to each row; without them the
        caller's saved customer location is used. Coordinates are matched against
        a real PostGIS radius query, so this stays a single index scan however many
        shops exist.
      summary: Find service providers
      parameters:
      - in: query
        name: lat
        schema:
          type: number
          format: double
        description: Search origin latitude.
      - in: query
        name: lng
        schema:
          type: number
          format: double
        description: Search origin longitude.
      - in: query
        name: min_rating
        schema:
          type: number
          format: double
        description: Ignore shops below this average.
      - in: query
        name: open_now
        schema:
          type: boolean
        description: Only shops currently inside their hours.
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
      - in: query
        name: radius_km
        schema:
          type: number
          format: double
        description: How far to look. Default 25, capped at 100.
      - in: query
        name: service_type
        schema:
          type: string
        description: barbershop, hair_salon, spa, ... or `all`.
      - in: query
        name: services
        schema:
          type: string
        description: Comma-separated. Only providers offering *every* one.
      tags:
      - providers
      security:
      - knoxApiToken: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  next:
                    type: string
                    nullable: true
                  previous:
                    type: string
                    nullable: true
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProviderList'
                  search_origin:
                    type: object
                    nullable: true
                  radius_km:
                    type: number
          description: A page of providers
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Stable machine-readable code, e.g. `business_rule_violation`.
                        example: validation_error
                      message:
                        type: string
                        description: A sentence safe to show a user.
                        example: That slot is already taken. Pick another time.
                      details:
                        nullable: true
                        description: Field-level detail when there is any; null otherwise.
                        example:
                          starts_at:
                          - This field is required.
                    required:
                    - code
                    - message
                    - details
                required:
                - error
              examples:
                Validation:
                  value:
                    error:
                      code: validation_error
