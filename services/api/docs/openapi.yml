        reason:
          type: string
          default: ''
          maxLength: 200
    CategoryEnum:
      enum:
      - haircare
      - tools
      - styling
      - skincare
      - other
      type: string
      description: |-
        * `haircare` - Hair care
        * `tools` - Tools
        * `styling` - Styling
        * `skincare` - Skincare
        * `other` - Other
    ChangePasswordRequest:
      type: object
