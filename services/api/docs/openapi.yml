    PublicUser:
      type: object
      description: 'What one user may see of another: essentially nothing.'
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        display_name:
          type: string
          readOnly: true
      required:
      - display_name
      - id
      - username
    PushToken:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        token:
          type: string
          maxLength: 255
        platform:
          description: |-
            Best effort; unknown values are kept rather than rejected.

            * `android` - Android
            * `ios` - iOS
          oneOf:
          - $ref: '#/components/schemas/PlatformEnum'
          - $ref: '#/components/schemas/BlankEnum'
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_seen_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - last_seen_at
      - token
    PushTokenRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 255
        platform:
          description: |-
            Best effort; unknown values are kept rather than rejected.

            * `android` - Android
            * `ios` - iOS
          oneOf:
          - $ref: '#/components/schemas/PlatformEnum'
          - $ref: '#/components/schemas/BlankEnum'
        active:
          type: boolean
      required:
      - token
    QuoteRequestRequest:
      type: object
      description: Ask what a booking would cost, before committing to it.
      properties:
        provider:
          type: integer
        services:
          type: array
          items:
            type: integer
        starts_at:
          type: string
          format: date-time
        promo_code:
          type: string
          maxLength: 32
      required:
      - provider
      - services
      - starts_at
    RefundBookingRequest:
      type: object
      description: Refund what the customer paid towards a booking.
      properties:
        amount:
          type: integer
          minimum: 1
          description: Defaults to everything paid.
        reason:
          type: string
          default: ''
          maxLength: 200
    RegisterRequest:
      type: object
      description: |-
        Account creation.

        ``role`` is chosen here so the app can show the right onboarding immediately
        after signup. It can be changed later, but not to nothing.
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 8
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          default: customer
      required:
      - email
      - password
      - username
    RescheduleRequest:
      type: object
      description: |-
        Move a booking to a different time.

        ``accept_price_change`` is the customer agreeing to a price that moved
        since they booked. It is a separate, explicit field rather than something
        inferred, because agreeing to more money is not something a client should
        do by omission.
      properties:
        starts_at:
          type: string
          format: date-time
        accept_price_change:
          type: boolean
          default: false
      required:
      - starts_at
    Review:
      type: object
      description: A review as it is read.
      properties:
        id:
          type: integer
          readOnly: true
        provider:
          type: integer
        provider_name:
          type: string
          readOnly: true
        customer_display_name:
          type: string
          readOnly: true
        customer_username:
          type: string
          readOnly: true
        booking:
          type: integer
          nullable: true
          description: Set when the review follows a completed booking.
        rating:
          type: integer
          maximum: 5
          minimum: 1
        comment:
          type: string
          maxLength: 1000
        provider_reply:
          type: string
          readOnly: true
        replied_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - customer_display_name
      - customer_username
      - id
      - provider
      - provider_name
      - provider_reply
      - rating
      - replied_at
    ReviewCreateRequest:
      type: object
      description: |-
        Leave a review.

        A review must be about a booking this customer actually made with this
        provider. The old endpoint accepted any rating, from anyone, about anyone —
        including 9 stars, because ``ratings`` had no range constraint.
      properties:
        provider:
          type: integer
        rating:
          type: integer
          maximum: 5
          minimum: 1
        comment:
          type: string
          default: ''
          maxLength: 1000
        booking:
          type: integer
          nullable: true
      required:
      - provider
      - rating
    ReviewReplyRequest:
      type: object
      description: A provider's public reply.
      properties:
        provider_reply:
          type: string
          maxLength: 1000
      required:
      - provider_reply
    RoleEnum:
      enum:
      - customer
      - provider
      type: string
      description: |-
        * `customer` - Customer
        * `provider` - Service provider
    SaveShopRequest:
      type: object
      description: Saving a shop. The note is optional; everything else is in the
        path.
      properties:
        note:
          type: string
          default: ''
          maxLength: 120
    SavedShop:
      type: object
      description: |-
        A saved shop, with enough of the shop to be useful on a list.

        The live fields matter: a shop that has stopped taking bookings is still
        saved and still shown, greyed rather than hidden. Somebody's usual barber
        does not stop existing because they took a holiday.
      properties:
        id:
          type: integer
          readOnly: true
        provider:
          type: object
          additionalProperties: {}
          readOnly: true
        note:
          type: string
          maxLength: 120
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - provider
    Service:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
        price:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Provider's price in the smallest currency unit (paise).
        price_display:
          type: string
          readOnly: true
        duration_minutes:
          type: integer
          maximum: 600
          minimum: 5
        is_active:
          type: boolean
          description: Retired services stay on old bookings but cannot be booked.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - price
      - price_display
      - updated_at
    ServiceRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
        price:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Provider's price in the smallest currency unit (paise).
        duration_minutes:
          type: integer
          maximum: 600
          minimum: 5
        is_active:
          type: boolean
          description: Retired services stay on old bookings but cannot be booked.
      required:
      - name
      - price
    ServiceTypeEnum:
      enum:
      - barbershop
      - hair_salon
      - beauty_salon
      - full_service_salon
      - spa
      - massage
      - other
      type: string
      description: |-
        * `barbershop` - Barber shop
        * `hair_salon` - Hair salon
        * `beauty_salon` - Beauty salon
        * `full_service_salon` - Full service salon
        * `spa` - Spa
        * `massage` - Massage
        * `other` - Other
    ShopProduct:
      type: object
      description: |-
        A product as it appears in a shop's storefront, with that shop's stock.

        Reads an `Inventory` row rather than a `Product`: the same shampoo in three
        shops is three rows with three stock levels, and a catalogue endpoint that
        cannot say which one it is describing is not useful to a shopfront.
      properties:
        id:
          type: integer
          readOnly: true
        product:
          allOf:
          - $ref: '#/components/schemas/Product'
          readOnly: true
        quantity:
          type: integer
          readOnly: true
        is_in_stock:
          type: boolean
          readOnly: true
      required:
      - id
      - is_in_stock
      - product
      - quantity
    Staff:
      type: object
      description: |-
        A person at a shop.

        Written for the booking screen, so it says whether this person is taking
        bookings right now rather than making the client work it out.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        bio:
          type: string
        photo:
          type: string
          format: uri
          nullable: true
        is_active:
          type: boolean
          readOnly: true
        is_placeholder:
          type: boolean
          readOnly: true
          description: Created from the old employee_count. Name it to clear the prompt.
        is_open_today:
          type: boolean
          readOnly: true
        hours:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
      required:
      - hours
      - id
      - is_active
      - is_open_today
      - is_placeholder
      - name
    StaffSummary:
      type: object
      description: |-
        Who is doing the job, on a booking.

        Frozen with the rest of the booking. If the person later leaves the shop
        their name stays on the appointment they worked.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        photo:
          type: string
          format: uri
          nullable: true
      required:
      - id
      - name
    StaffWorkingHoursRequest:
      type: object
      properties:
        weekday:
          type: integer
          maximum: 6
          minimum: 0
        is_closed:
          type: boolean
          default: false
        opens_at:
          type: string
          format: time
          default: 09:00:00
        closes_at:
          type: string
          format: time
          default: '20:00:00'
      required:
      - weekday
    StaffWriteRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        bio:
          type: string
        photo:
          type: string
          format: binary
          nullable: true
        is_active:
          type: boolean
        hours:
          type: array
          items:
            $ref: '#/components/schemas/StaffWorkingHoursRequest'
      required:
      - name
    VerifyEmailRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 4
          maxLength: 16
      required:
      - code
    VerifyPaymentRequest:
      type: object
      description: |-
        Verify a checkout the customer just completed in the app.

        This **confirms** a payment, it does not create one. The signature is
        checked against Razorpay's secret, and then Razorpay itself is asked what
        happened. Nothing in this path lets a client assert that a payment
        succeeded — the old ``PUT /createorder`` did exactly that.
      properties:
        razorpay_order_id:
          type: string
          minLength: 1
        razorpay_payment_id:
          type: string
          minLength: 1
        razorpay_signature:
          type: string
          minLength: 1
      required:
      - razorpay_order_id
      - razorpay_payment_id
      - razorpay_signature
    WaitlistDeclineResult:
      type: object
      description: |-
        What happened when someone let a held slot go.

        ``passed_on`` is the part worth sending: without it a customer who has
        already declined sits waiting to find out whether anybody took it.
      properties:
        declined:
          type: boolean
        passed_on:
          type: boolean
      required:
      - declined
      - passed_on
    WaitlistEntry:
      type: object
      description: A waitlist entry, as the customer sees their own.
      properties:
        id:
          type: integer
          readOnly: true
        provider:
          type: integer
        provider_name:
          type: string
          readOnly: true
        service:
          type: integer
        service_name:
          type: string
          readOnly: true
        staff:
          type: integer
          nullable: true
        staff_name:
          type: string
          readOnly: true
        window_start:
          type: string
          format: date-time
        window_end:
          type: string
          format: date-time
        status:
          allOf:
          - $ref: '#/components/schemas/WaitlistEntryStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - provider
      - provider_name
      - service
      - service_name
      - staff_name
      - status
      - window_end
      - window_start
    WaitlistEntryStatusEnum:
      enum:
      - waiting
      - offered
      - booked
      - declined
      - left
      type: string
      description: |-
        * `waiting` - Waiting
        * `offered` - Offered
        * `booked` - Booked
        * `declined` - Declined
        * `left` - Left
    WaitlistJoinRequest:
      type: object
      description: Ask to be told when something frees up.
      properties:
        provider:
          type: integer
        service:
          type: integer
        staff:
          type: integer
          nullable: true
        window_start:
          type: string
          format: date-time
        window_end:
          type: string
          format: date-time
      required:
      - provider
      - service
      - window_end
      - window_start
    WaitlistOffer:
      type: object
      description: A slot being held for this customer, and how long they have.
      properties:
        id:
          type: integer
          readOnly: true
        shop_name:
          type: string
          readOnly: true
        service_name:
          type: string
          readOnly: true
        staff_name:
          type: string
          readOnly: true
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/WaitlistOfferStatusEnum'
        expires_at:
          type: string
          format: date-time
        seconds_left:
          type: integer
          readOnly: true
        can_accept:
          type: boolean
          description: |-
            Whether accepting would still succeed.

            The hold may have lapsed without the cleanup task having run, and
            offering a button that will be refused is worse than not offering it.
          readOnly: true
      required:
      - can_accept
      - ends_at
      - expires_at
      - id
      - seconds_left
      - service_name
      - shop_name
      - staff_name
      - starts_at
    WaitlistOfferStatusEnum:
      enum:
      - pending
      - accepted
      - declined
      - expired
      type: string
      description: |-
        * `pending` - Pending
        * `accepted` - Accepted
        * `declined` - Declined
        * `expired` - Expired
    WeekdayEnum:
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      type: integer
      description: |-
        * `0` - Monday
        * `1` - Tuesday
        * `2` - Wednesday
        * `3` - Thursday
        * `4` - Friday
        * `5` - Saturday
        * `6` - Sunday
    WithdrawalRequest:
      type: object
      description: |-
        Ask for money to go to the bank.

        Amount is optional and defaults to everything cleared, which is what
        providers want 95% of the time.
      properties:
        amount:
          type: integer
          minimum: 1
          description: Defaults to everything cleared. Pending earnings cannot be
            paid early.
    WorkingHours:
      type: object
      description: One weekday of opening hours.
      properties:
        id:
          type: integer
          readOnly: true
        weekday:
          allOf:
          - $ref: '#/components/schemas/WeekdayEnum'
          description: |-
            0 = Monday. Django's date.weekday() convention.

            * `0` - Monday
            * `1` - Tuesday
            * `2` - Wednesday
            * `3` - Thursday
            * `4` - Friday
            * `5` - Saturday
            * `6` - Sunday
          minimum: 0
          maximum: 6
        weekday_label:
          type: string
          readOnly: true
        is_closed:
          type: boolean
        opens_at:
          type: string
          format: time
        closes_at:
          type: string
          format: time
      required:
      - closes_at
      - id
      - opens_at
      - weekday
      - weekday_label
    WorkingHoursRequest:
      type: object
      description: One weekday of opening hours.
      properties:
        weekday:
          allOf:
          - $ref: '#/components/schemas/WeekdayEnum'
          description: |-
            0 = Monday. Django's date.weekday() convention.

            * `0` - Monday
            * `1` - Tuesday
            * `2` - Wednesday
            * `3` - Thursday
            * `4` - Friday
            * `5` - Saturday
            * `6` - Sunday
          minimum: 0
          maximum: 6
        is_closed:
          type: boolean
        opens_at:
          type: string
          format: time
        closes_at:
          type: string
          format: time
      required:
      - closes_at
      - opens_at
      - weekday
    WorkingHoursWriteRequest:
      type: object
      description: |-
        The whole week in one request.

        A provider setting hours wants to set the week, not to make seven requests.
      properties:
        days:
          type: array
          items:
            $ref: '#/components/schemas/WorkingHoursRequest'
      required:
      - days
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    knoxApiToken:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
