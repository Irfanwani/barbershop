        contact_phone:
          type: string
          maxLength: 20
        employee_count:
          type: integer
          maximum: 32767
          minimum: 0
        opening_time:
          type: string
          format: time
        closing_time:
          type: string
          format: time
        slot_interval_minutes:
          type: integer
          maximum: 240
          minimum: 5
          description: Granularity of the bookable slots.
        is_accepting_bookings:
          type: boolean
        requires_approval:
          type: boolean
          description: When true, a booking starts as pending and the provider accepts
            it.
