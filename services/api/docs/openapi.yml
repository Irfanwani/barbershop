components:
  schemas:
    AccountState:
      type: object
      description: |-
        The current user plus every flag the app branches on during onboarding.

        The old ``authenticateuser`` endpoint returned ``is_barber`` computed by
        trying ``BarberDetails.objects.get(...)`` and falling through to
        ``is_barber=True``, so a brand-new customer was reported as a barber.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        display_name:
          type: string
          readOnly: true
        role:
          type: string
          readOnly: true
        is_verified:
          type: boolean
          readOnly: true
          description: True once the address on this account has been confirmed.
        verified_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        has_customer_profile:
          type: boolean
          readOnly: true
        has_provider_profile:
          type: boolean
          readOnly: true
        has_payout:
          type: boolean
          readOnly: true
        service_count:
          type: integer
          readOnly: true
        onboarding_complete:
          type: boolean
          readOnly: true
      required:
      - display_name
      - email
      - first_name
      - has_customer_profile
      - has_payout
      - has_provider_profile
      - id
      - is_verified
      - last_name
      - onboarding_complete
      - role
      - service_count
      - username
      - verified_at
    AccountTypeEnum:
      enum:
      - savings
      - current
      type: string
      description: |-
        * `savings` - Savings
        * `current` - Current
    ActionEnum:
      enum:
      - cancel
      - ready
      - collect
      type: string
      description: |-
        * `cancel` - cancel
        * `ready` - ready
        * `collect` - collect
    AvailabilityToggleRequest:
      type: object
      description: |-
        Accepting bookings, or not.

        Separate from the shop serializer because turning this off is the single
        most consequential thing a provider can do from the app, and it deserves an
        explicit, self-describing call.
      properties:
        is_accepting_bookings:
          type: boolean
      required:
      - is_accepting_bookings
    BlankEnum:
