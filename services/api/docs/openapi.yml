          type: integer
          maximum: 240
          minimum: 5
          description: Granularity of the bookable slots.
        is_accepting_bookings:
          type: boolean
        requires_approval:
          type: boolean
          description: When true, a booking starts as pending and the provider accepts
            it.
        rating_average:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
          readOnly: true
        rating_count:
          type: integer
          readOnly: true
        payout_registered:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - coords
      - created_at
      - display_name
      - id
      - payout_registered
      - rating_average
      - rating_count
      - service_type
      - updated_at
    ProviderWriteRequest:
      type: object
      description: |-
        Create or update a shop.

        ``coords`` arrives as ``{latitude, longitude}`` and has to become a
        ``Point`` before it reaches the model. Doing that in the serializer means
        the view never has to touch request data directly.
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
        service_type:
          $ref: '#/components/schemas/ServiceTypeEnum'
        photo:
          type: string
          format: binary
          nullable: true
        cover_photo:
          type: string
          format: binary
          nullable: true
        address:
          type: string
          maxLength: 300
        coords:
          $ref: '#/components/schemas/PointFieldRequest'
        contact_phone:
          type: string
          maxLength: 20
        employee_count:
          type: integer
          maximum: 32767
          minimum: 0
        opening_time:
          type: string
          format: time
        closing_time:
          type: string
          format: time
        slot_interval_minutes:
          type: integer
          maximum: 240
          minimum: 5
          description: Granularity of the bookable slots.
        is_accepting_bookings:
          type: boolean
        requires_approval:
          type: boolean
          description: When true, a booking starts as pending and the provider accepts
            it.
      required:
      - coords
      - display_name
      - service_type
    PublicUser:
      type: object
      description: 'What one user may see of another: essentially nothing.'
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        display_name:
          type: string
          readOnly: true
      required:
      - display_name
      - id
      - username
    PushToken:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        token:
          type: string
          maxLength: 255
        platform:
          description: |-
            Best effort; unknown values are kept rather than rejected.

            * `android` - Android
            * `ios` - iOS
          oneOf:
          - $ref: '#/components/schemas/PlatformEnum'
          - $ref: '#/components/schemas/BlankEnum'
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_seen_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - last_seen_at
      - token
    PushTokenRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 255
        platform:
          description: |-
            Best effort; unknown values are kept rather than rejected.

            * `android` - Android
            * `ios` - iOS
          oneOf:
          - $ref: '#/components/schemas/PlatformEnum'
          - $ref: '#/components/schemas/BlankEnum'
        active:
          type: boolean
      required:
      - token
    QuoteRequestRequest:
      type: object
      description: Ask what a booking would cost, before committing to it.
      properties:
        provider:
          type: integer
        services:
          type: array
          items:
            type: integer
        starts_at:
          type: string
          format: date-time
      required:
      - provider
      - services
      - starts_at
    RegisterRequest:
      type: object
      description: |-
        Account creation.

        ``role`` is chosen here so the app can show the right onboarding immediately
        after signup. It can be changed later, but not to nothing.
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 8
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          default: customer
      required:
      - email
      - password
      - username
    Review:
      type: object
      description: A review as it is read.
      properties:
        id:
          type: integer
          readOnly: true
        provider:
          type: integer
        provider_name:
          type: string
          readOnly: true
        customer_display_name:
          type: string
          readOnly: true
        customer_username:
          type: string
          readOnly: true
        booking:
          type: integer
          nullable: true
          description: Set when the review follows a completed booking.
        rating:
          type: integer
          maximum: 5
          minimum: 1
        comment:
          type: string
          maxLength: 1000
        provider_reply:
          type: string
          readOnly: true
        replied_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - customer_display_name
      - customer_username
      - id
      - provider
      - provider_name
      - provider_reply
      - rating
      - replied_at
    ReviewCreateRequest:
      type: object
      description: |-
        Leave a review.

        A review must be about a booking this customer actually made with this
        provider. The old endpoint accepted any rating, from anyone, about anyone —
        including 9 stars, because ``ratings`` had no range constraint.
      properties:
        provider:
          type: integer
        rating:
          type: integer
          maximum: 5
          minimum: 1
        comment:
          type: string
          default: ''
          maxLength: 1000
        booking:
          type: integer
          nullable: true
      required:
      - provider
      - rating
    ReviewReplyRequest:
      type: object
      description: A provider's public reply.
      properties:
        provider_reply:
          type: string
          maxLength: 1000
      required:
      - provider_reply
    RoleEnum:
      enum:
      - customer
      - provider
      type: string
      description: |-
        * `customer` - Customer
        * `provider` - Service provider
    Service:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
        price:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Provider's price in the smallest currency unit (paise).
        price_display:
          type: string
          readOnly: true
        duration_minutes:
          type: integer
          maximum: 600
          minimum: 5
        is_active:
          type: boolean
          description: Retired services stay on old bookings but cannot be booked.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - price
      - price_display
      - updated_at
    ServiceRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
        price:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Provider's price in the smallest currency unit (paise).
        duration_minutes:
          type: integer
          maximum: 600
          minimum: 5
        is_active:
          type: boolean
          description: Retired services stay on old bookings but cannot be booked.
      required:
      - name
      - price
    ServiceTypeEnum:
      enum:
      - barbershop
      - hair_salon
      - beauty_salon
      - full_service_salon
      - spa
      - massage
      - other
      type: string
      description: |-
        * `barbershop` - Barber shop
        * `hair_salon` - Hair salon
        * `beauty_salon` - Beauty salon
        * `full_service_salon` - Full service salon
        * `spa` - Spa
        * `massage` - Massage
        * `other` - Other
    ShopProduct:
      type: object
      description: |-
        A product as it appears in a shop's storefront, with that shop's stock.

        Reads an `Inventory` row rather than a `Product`: the same shampoo in three
        shops is three rows with three stock levels, and a catalogue endpoint that
        cannot say which one it is describing is not useful to a shopfront.
      properties:
        id:
          type: integer
          readOnly: true
        product:
          allOf:
          - $ref: '#/components/schemas/Product'
          readOnly: true
        quantity:
          type: integer
          readOnly: true
        is_in_stock:
          type: boolean
          readOnly: true
      required:
      - id
      - is_in_stock
      - product
      - quantity
    VerifyEmailRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 4
          maxLength: 16
      required:
      - code
    VerifyPaymentRequest:
      type: object
      description: |-
        Verify a checkout the customer just completed in the app.

        This **confirms** a payment, it does not create one. The signature is
        checked against Razorpay's secret, and then Razorpay itself is asked what
        happened. Nothing in this path lets a client assert that a payment
        succeeded — the old ``PUT /createorder`` did exactly that.
      properties:
        razorpay_order_id:
          type: string
          minLength: 1
        razorpay_payment_id:
          type: string
          minLength: 1
        razorpay_signature:
          type: string
          minLength: 1
      required:
      - razorpay_order_id
      - razorpay_payment_id
      - razorpay_signature
    WeekdayEnum:
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      type: integer
      description: |-
        * `0` - Monday
        * `1` - Tuesday
        * `2` - Wednesday
        * `3` - Thursday
        * `4` - Friday
        * `5` - Saturday
        * `6` - Sunday
    WorkingHours:
      type: object
      description: One weekday of opening hours.
      properties:
        id:
          type: integer
          readOnly: true
        weekday:
          allOf:
          - $ref: '#/components/schemas/WeekdayEnum'
          description: |-
            0 = Monday. Django's date.weekday() convention.

            * `0` - Monday
            * `1` - Tuesday
            * `2` - Wednesday
            * `3` - Thursday
            * `4` - Friday
            * `5` - Saturday
            * `6` - Sunday
          minimum: 0
          maximum: 6
        weekday_label:
          type: string
          readOnly: true
        is_closed:
          type: boolean
        opens_at:
          type: string
          format: time
        closes_at:
          type: string
          format: time
      required:
      - closes_at
      - id
      - opens_at
      - weekday
      - weekday_label
    WorkingHoursRequest:
      type: object
      description: One weekday of opening hours.
      properties:
        weekday:
          allOf:
          - $ref: '#/components/schemas/WeekdayEnum'
          description: |-
            0 = Monday. Django's date.weekday() convention.

            * `0` - Monday
            * `1` - Tuesday
            * `2` - Wednesday
            * `3` - Thursday
            * `4` - Friday
            * `5` - Saturday
            * `6` - Sunday
          minimum: 0
          maximum: 6
        is_closed:
          type: boolean
        opens_at:
          type: string
          format: time
        closes_at:
          type: string
          format: time
      required:
      - closes_at
      - opens_at
      - weekday
    WorkingHoursWriteRequest:
      type: object
      description: |-
        The whole week in one request.

        A provider setting hours wants to set the week, not to make seven requests.
      properties:
        days:
          type: array
          items:
            $ref: '#/components/schemas/WorkingHoursRequest'
      required:
      - days
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    knoxApiToken:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
tags:
- name: auth
  description: Registration, login, tokens, password reset.
- name: bookings
  description: Appointments between a customer and a provider.
- name: me
  description: The authenticated user's own account and profile.
- name: payments
  description: Razorpay order creation and webhook confirmation.
- name: providers
  description: 'Service providers: discovery, services, availability.'
- name: reviews
  description: Ratings and comments left after a booking.
