      properties:
        booking:
          type: string
          minLength: 1
          description: Booking reference, e.g. BK-7QK4M2.
      required:
      - booking
    CustomerProfile:
      type: object
      properties:
        about:
          type: string
          maxLength: 500
        address:
          type: string
          maxLength: 300
        photo:
          type: string
          format: uri
          nullable: true
        coords:
          allOf:
          - $ref: '#/components/schemas/PointField'
          nullable: true
        has_location:
          type: boolean
          readOnly: true
        preferred_service_type:
          type: string
          maxLength: 32
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - has_location
      - updated_at
    CustomerProfileRequest:
      type: object
      properties:
        about:
          type: string
          maxLength: 500
        address:
          type: string
          maxLength: 300
        photo:
          type: string
          format: binary
          nullable: true
        coords:
          allOf:
          - $ref: '#/components/schemas/PointFieldRequest'
          nullable: true
        preferred_service_type:
          type: string
          maxLength: 32
    Inventory:
