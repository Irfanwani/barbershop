      - new_password
    CollectBalanceMethodEnum:
      enum:
      - cash
      - upi
      - card
      type: string
      description: |-
        * `cash` - cash
        * `upi` - upi
        * `card` - card
    CollectBalanceRequest:
      type: object
      description: |-
        Take the balance in the shop.

        Amount is optional and defaults to everything outstanding, because that is
        what happens in practice: the customer settles up in full.
      properties:
        amount:
          type: integer
          minimum: 1
          description: Defaults to the full outstanding balance.
        method:
          allOf:
          - $ref: '#/components/schemas/CollectBalanceMethodEnum'
