      - late_cancel_fee_display
      - notes
      - platform_fee
      - platform_fee_display
      - provider
      - reference
      - requires_deposit
      - staff
      - starts_at
      - status
      - subtotal
      - subtotal_display
      - total
      - total_display
    BookingCreateRequest:
      type: object
      description: |-
        Create a booking.

        Accepts ``provider``, ``services`` (ids) and ``starts_at``. The total is
        computed here from :class:`~providers.models.Service` rows, never read from
        the request.

        The old endpoint stored ``request.data['totalcost']`` verbatim, so a client
        could book a 900-rupee haircut for one rupee.
      properties:
        provider:
          type: integer
        staff:
          type: integer
          nullable: true
        services:
          type: array
          items:
            type: integer
        starts_at:
          type: string
          format: date-time
        notes:
          type: string
          default: ''
          maxLength: 500
        promo_code:
          type: string
          maxLength: 32
      required:
      - provider
      - services
      - starts_at
    BookingItem:
      type: object
      description: |-
        One line of a booking.

        Reads the snapshot, not the live service row: if the provider raises this
        price next month, yesterday's invoice must not change.
      properties:
        id:
          type: integer
          readOnly: true
        service:
          type: integer
          readOnly: true
          nullable: true
        name:
          type: string
          readOnly: true
        unit_price:
          type: integer
          readOnly: true
          description: In the smallest currency unit.
        unit_price_display:
          type: string
          readOnly: true
        quantity:
          type: integer
          readOnly: true
        duration_minutes:
          type: integer
          readOnly: true
        line_total:
          type: integer
          readOnly: true
      required:
      - duration_minutes
      - id
      - line_total
      - name
      - quantity
      - service
      - unit_price
      - unit_price_display
    BookingStatusEnum:
      enum:
      - pending_payment
      - awaiting_confirmation
      - confirmed
      - completed
      - cancelled_by_customer
      - cancelled_by_provider
      - no_show
      - refunded
      - expired
      type: string
      description: |-
        * `pending_payment` - Awaiting payment
        * `awaiting_confirmation` - Awaiting provider confirmation
        * `confirmed` - Confirmed
        * `completed` - Completed
        * `cancelled_by_customer` - Cancelled by customer
        * `cancelled_by_provider` - Cancelled by provider
        * `no_show` - No show
        * `refunded` - Refunded
        * `expired` - Expired
    BusinessTypeEnum:
      enum:
      - individual
      - partnership
      - proprietorship
      - company
      - not_yet_registered
      type: string
      description: |-
        * `individual` - Individual
        * `partnership` - Partnership
        * `proprietorship` - Proprietorship
        * `company` - Company
        * `not_yet_registered` - Not yet registered
    CancelBookingRequest:
      type: object
