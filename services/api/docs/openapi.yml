openapi: 3.0.3
info:
  title: BarberShop API
  version: 1.0.0
  description: REST API for the BarberShop marketplace. Connects customers with barbers,
    salons and spas. Geospatial provider search, bookings, Razorpay payments and reviews.
paths:
  /api/v1/auth/register/:
    post:
      operationId: auth_register
      description: 'Registers a customer or provider and emails a verification code.
        A token is returned straight away so the app can show the verification screen
        without a second round trip, but it grants little: anything sensitive requires
        a verified address.'
      summary: Create an account
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - knoxApiToken: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    type: object
                  verification_required:
                    type: boolean
                    example: true
                  verification_email_sent:
                    type: boolean
                    example: true
          description: Account created
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Stable machine-readable code, e.g. `business_rule_violation`.
                        example: validation_error
                      message:
                        type: string
                        description: A sentence safe to show a user.
                        example: That slot is already taken. Pick another time.
                      details:
                        nullable: true
                        description: Field-level detail when there is any; null otherwise.
                        example:
                          starts_at:
                          - This field is required.
                    required:
                    - code
                    - message
                    - details
                required:
                - error
              examples:
                Validation:
                  value:
                    error:
                      code: validation_error
                      message: This field is required.
                      details:
                        starts_at:
                        - This field is required.
                  summary: A field is missing or the wrong shape
                BusinessRule:
                  value:
                    error:
                      code: business_rule_violation
                      message: That slot is already taken. Pick another time.
                      details: null
                  summary: Well-formed, but not allowed right now
          description: Malformed request, or one that breaks a business rule
        '429':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
          description: Too many attempts. Slow down.
  /api/v1/auth/login/:
    post:
      operationId: auth_login
      description: Accepts a username or an email address. An unknown account and
        a wrong password produce the same answer, so this cannot be used to discover
