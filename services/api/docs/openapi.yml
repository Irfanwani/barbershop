        description:
          type: string
          maxLength: 1000
        brand:
          type: string
          maxLength: 80
        category:
          $ref: '#/components/schemas/CategoryEnum'
        price:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Shop price in paise.
        compare_at_price:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          description: Was-price in paise, for showing a discount. Not charged.
        photo:
          type: string
