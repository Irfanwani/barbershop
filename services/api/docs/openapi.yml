      - lines
      - provider
      - total_display
    OrderCreateRequest:
      type: object
      description: |-
        Create an order from a basket.

        The provider is not in the request: a basket spans one shop, because
        fulfilment is collection from that shop and a customer cannot collect from
        two addresses in one trip.
      properties:
        provider:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderLineRequest'
        notes:
          type: string
          default: ''
          maxLength: 500
      required:
      - items
      - provider
    OrderLineRequest:
      type: object
      description: |-
        One line, requested by product id and quantity.

        No price is accepted. The price comes from the product row, exactly as a
        booking's price comes from the service row.
      properties:
        product:
          type: integer
        quantity:
          type: integer
          maximum: 20
          minimum: 1
      required:
      - product
      - quantity
    OrderStatusActionRequest:
      type: object
      description: |-
        Which transition the caller wants, as a string rather than a URL.

        The old appointments API accepted a bare status string and let the caller
        write any status at all. The permitted set is this enum, and the view checks
        it against the order's current status too.
      properties:
        action:
          $ref: '#/components/schemas/ActionEnum'
      required:
      - action
    OrderStatusEnum:
      enum:
      - pending
      - paid
      - ready
      - collected
      - cancelled
      - refunded
      type: string
      description: |-
        * `pending` - Pending
        * `paid` - Paid
        * `ready` - Ready for collection
        * `collected` - Collected
        * `cancelled` - Cancelled
        * `refunded` - Refunded
    PasswordResetConfirmRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        code:
          type: string
          minLength: 4
          maxLength: 16
        new_password:
          type: string
          writeOnly: true
          minLength: 8
      required:
      - code
      - email
      - new_password
    PasswordResetRequestRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    PatchedProviderWriteRequest:
      type: object
      description: |-
        Create or update a shop.

        ``coords`` arrives as ``{latitude, longitude}`` and has to become a
        ``Point`` before it reaches the model. Doing that in the serializer means
        the view never has to touch request data directly.
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
        service_type:
          $ref: '#/components/schemas/ServiceTypeEnum'
        photo:
          type: string
          format: binary
          nullable: true
        cover_photo:
          type: string
          format: binary
          nullable: true
        address:
          type: string
          maxLength: 300
        coords:
          $ref: '#/components/schemas/PointFieldRequest'
        contact_phone:
          type: string
          maxLength: 20
        employee_count:
          type: integer
          maximum: 32767
          minimum: 0
        opening_time:
          type: string
          format: time
        closing_time:
          type: string
          format: time
        slot_interval_minutes:
          type: integer
          maximum: 240
          minimum: 5
          description: Granularity of the bookable slots.
        is_accepting_bookings:
          type: boolean
        requires_approval:
          type: boolean
          description: When true, a booking starts as pending and the provider accepts
            it.
    PatchedServiceRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
        price:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Provider's price in the smallest currency unit (paise).
        duration_minutes:
          type: integer
          maximum: 600
          minimum: 5
        is_active:
          type: boolean
          description: Retired services stay on old bookings but cannot be booked.
    PatchedStaffWriteRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        bio:
          type: string
        photo:
          type: string
          format: binary
          nullable: true
        is_active:
          type: boolean
        hours:
          type: array
          items:
            $ref: '#/components/schemas/StaffWorkingHoursRequest'
    PatchedUpdateProfileRequest:
      type: object
      properties:
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        phone:
          type: string
          maxLength: 20
        avatar:
          type: string
          format: binary
          nullable: true
        timezone_name:
          type: string
          description: IANA zone used to render appointment times, e.g. Asia/Kolkata.
          maxLength: 64
    Payment:
      type: object
      description: |-
        A payment, as read.

        ``amount`` is in the smallest currency unit; ``amount_display`` is for
        humans. Neither is client-settable.
      properties:
        id:
          type: integer
          readOnly: true
        booking:
          type: integer
          readOnly: true
        booking_reference:
          type: string
          readOnly: true
        kind:
          type: string
          readOnly: true
        razorpay_order_id:
          type: string
          readOnly: true
        razorpay_payment_id:
          type: string
          readOnly: true
        amount:
          type: integer
          readOnly: true
          description: In the smallest currency unit.
        amount_display:
          type: string
          readOnly: true
        currency:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/PaymentStatusEnum'
          readOnly: true
          default: created
        method:
          allOf:
          - $ref: '#/components/schemas/PaymentMethodEnum'
          readOnly: true
        is_captured:
          type: boolean
          readOnly: true
        captured_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        failure_reason:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - amount_display
      - booking
      - booking_reference
      - captured_at
      - created_at
      - currency
      - failure_reason
      - id
      - is_captured
      - kind
      - method
      - razorpay_order_id
      - razorpay_payment_id
      - status
    PaymentMethodEnum:
      enum:
      - razorpay
      - cash
      type: string
      description: |-
        * `razorpay` - Razorpay
        * `cash` - Cash at the shop
    PaymentStatusEnum:
      enum:
      - created
      - attempted
      - captured
      - failed
      - refunded
      type: string
      description: |-
        * `created` - Order created
        * `attempted` - Payment attempted
        * `captured` - Captured
        * `failed` - Failed
        * `refunded` - Refunded
    PaymentWebhookRequest:
      type: object
      description: |-
        Razorpay's webhook envelope.

        Documented here for the schema, but **not used to validate the request**.
        The signature covers the raw bytes, so it is verified first and in full —
        before this shape is parsed, and before any of it is trusted. Parsing an
        unverified payload and then checking a signature over the re-serialised
        version would be a different check, and a weaker one.
      properties:
        event:
          type: string
          minLength: 1
          description: '`payment.captured` or `payment.failed`; anything else is acknowledged
            and ignored.'
        payload:
          type: object
          additionalProperties: {}
      required:
      - event
      - payload
    PayoutRequest:
      type: object
      description: |-
        Provider payout account.

        Account number and IFSC code are write-only and read back masked. The old
        ``BankDetailsSerializer`` used ``fields='__all__'`` and handed the full
        account number to any authenticated caller who asked.
      properties:
        business_name:
          type: string
          minLength: 1
          maxLength: 120
        business_type:
          $ref: '#/components/schemas/BusinessTypeEnum'
        beneficiary_name:
          type: string
          minLength: 1
          maxLength: 120
        account_type:
          $ref: '#/components/schemas/AccountTypeEnum'
        account_number:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 34
        ifsc_code:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 11
    PlatformEnum:
      enum:
      - android
      - ios
      type: string
      description: |-
        * `android` - Android
        * `ios` - iOS
    PointField:
      type: object
      description: |-
        Accepts either ``{"lat": .., "lng": ..}`` or GeoJSON.

        The old views read ``request.data['lat']`` and ``request.data['lng']``
        separately inside a bare ``try:`` — so a missing key and a malformed point
        both produced the same unhelpful 400.
      properties:
        latitude:
          type: number
          format: double
          maximum: 90
          minimum: -90
        longitude:
          type: number
          format: double
          maximum: 180
          minimum: -180
    PointFieldRequest:
      type: object
      description: |-
        Accepts either ``{"lat": .., "lng": ..}`` or GeoJSON.

        The old views read ``request.data['lat']`` and ``request.data['lng']``
        separately inside a bare ``try:`` — so a missing key and a malformed point
        both produced the same unhelpful 400.
      properties:
        latitude:
          type: number
          format: double
          maximum: 90
          minimum: -90
        longitude:
          type: number
          format: double
          maximum: 180
          minimum: -180
    Product:
