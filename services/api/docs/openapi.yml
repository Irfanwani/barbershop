        * `ios` - iOS
    PointField:
      type: object
      description: |-
        Accepts either ``{"lat": .., "lng": ..}`` or GeoJSON.

        The old views read ``request.data['lat']`` and ``request.data['lng']``
        separately inside a bare ``try:`` — so a missing key and a malformed point
        both produced the same unhelpful 400.
      properties:
        latitude:
          type: number
          format: double
          maximum: 90
          minimum: -90
        longitude:
          type: number
          format: double
          maximum: 180
          minimum: -180
    PointFieldRequest:
      type: object
      description: |-
        Accepts either ``{"lat": .., "lng": ..}`` or GeoJSON.

        The old views read ``request.data['lat']`` and ``request.data['lng']``
        separately inside a bare ``try:`` — so a missing key and a malformed point
        both produced the same unhelpful 400.
      properties:
        latitude:
          type: number
          format: double
          maximum: 90
          minimum: -90
        longitude:
          type: number
          format: double
          maximum: 180
          minimum: -180
