[project]
name = "barbershop-api"
version = "2.0.0"
description = "REST API for the BarberShop marketplace — Django + DRF + PostGIS"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Irfan Wani", email = "irfanwani347@gmail.com" }]

dependencies = [
    # --- web framework -------------------------------------------------------
    "django>=5.2,<5.3",
    "djangorestframework>=3.16,<3.17",
    "django-rest-knox>=5.0,<6.0",
    "drf-spectacular>=0.28,<0.29",
    "django-cors-headers>=4.7,<5.0",
    "whitenoise[brotli]>=6.9",
    "gunicorn>=23.0",
    # --- persistence ---------------------------------------------------------
    "psycopg[binary]>=3.2",
    "django-storages[s3]>=1.14",
    # --- data / media -------------------------------------------------------
    "pillow>=11.0",
    # --- integrations -------------------------------------------------------
    "razorpay>=1.4",
    "requests>=2.32",
    # --- security -----------------------------------------------------------
    "cryptography>=44.0",
    # --- config -------------------------------------------------------------
    "python-dotenv>=1.0",
    "django-cleanup>=9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    "pytest-randomly>=3.15",
    "ruff>=0.9",
    "mypy>=1.14",
    "django-stubs[compatible-mypy]>=5.1",
    "djangorestframework-stubs>=3.15",
    "freezegun>=1.5",
    "pyyaml>=6.0.3",
]
ci = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

# This is a Django application, not a library: `uv sync` should set up an
# environment for it rather than build and install a wheel of it.
[tool.uv]
package = false
# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*", ".venv", "staticfiles"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "DJ",  # flake8-django
    "RUF", # ruff-specific
]
ignore = [
    "E501",    # line length is ruff format's job, not the linter's
    "RUF012",  # mutable class attributes need ClassVar in Django models
    "B008",    # DRF's get_object_or_404 idiom trips this
]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["S101"]
"tests/*" = ["S101"]
"*/migrations/*" = ["E501"]
"config/settings/*.py" = ["F403", "F405"]
# The pre-v1 apps are deleted in the next commit; until then, ruff is not asked
# to police code that is on its way out.
"accounts/views*.py" = ["E722", "RUF015", "F841"]
"accounts/legacy.py" = ["E722", "F841", "E501"]
"accounts/register.py" = ["E722", "F841"]
"haircut/*.py" = ["E722", "DJ001", "F841"]
"payments/*.py" = ["E722", "F841"]

[tool.ruff.lint.isort]
known-first-party = ["config", "core", "accounts", "providers", "bookings", "reviews", "payments"]
combine-as-imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py"]
testpaths = ["tests"]
addopts = """
    --strict-markers
    --strict-config
    --reuse-db
    --cov=accounts
    --cov=providers
    --cov=bookings
    --cov=reviews
    --cov=payments
    --cov=core
    --cov-branch
    --cov-report=term-missing:skip-covered
    --cov-report=html
    --cov-fail-under=85
"""
markers = [
    "integration: exercises a real external dependency",
]
filterwarnings = ["error::DeprecationWarning:barbershop.*"]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
# The pre-v1 request handlers are deleted in the commit that adds /api/v1/;
# counting them against the gate would mean the gate can never be met honestly.
omit = [
    "*/migrations/*",
    "config/settings/*",
    "manage.py",
    "tests/*",
    "accounts/register.py",
    "accounts/serializers.py",
    "accounts/legacy.py",
    "accounts/views.py",
    "accounts/views2.py",
    "haircut/*",
    "payments/views.py",
    "payments/urls.py",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = false
exclude = ['^.*/migrations/', '^config/settings/']

[[tool.mypy.overrides]]
module = "razorpay.*"
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"
